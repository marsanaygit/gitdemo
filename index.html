<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>植物陣取り テストプレイ台</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#edf0e4;--panel:#f8f9f2;--ink:#1c2a20;--muted:#5f6f63;--line:#c7d0bd;
  --accent:#2d6a4f;--accent-ink:#fff;--warn:#b4531a;--hl:#ff5d2a;
  --v1:#eef0dc;--v2:#dfe8b8;--v3:#c6dc94;--v4:#a6c974;--v5:#86b356;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141b16;--panel:#1d2720;--ink:#e6ece1;--muted:#93a498;--line:#324036;
    --accent:#7cc79c;--accent-ink:#0f1a13;--warn:#e9955a;--hl:#ff8a5c;
    --v1:#2a3126;--v2:#34432a;--v3:#3f5630;--v4:#4c6d38;--v5:#5a8541;
  }
}
:root[data-theme="dark"]{
  --bg:#141b16;--panel:#1d2720;--ink:#e6ece1;--muted:#93a498;--line:#324036;
  --accent:#7cc79c;--accent-ink:#0f1a13;--warn:#e9955a;--hl:#ff8a5c;
  --v1:#2a3126;--v2:#34432a;--v3:#3f5630;--v4:#4c6d38;--v5:#5a8541;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.55}
h1,h2,h3{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Noto Serif JP',serif;margin:0;line-height:1.3}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1080px;margin:0 auto;padding:10px 10px 40px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.top .ttl{flex:1;min-width:150px}
.top .sub{color:var(--muted);font-size:12px}
.btn{min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.sm{min-height:36px;padding:4px 10px;font-size:13px}
.btn:focus-visible,.item:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.card h2,.card h3{margin-bottom:6px}
.mut{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.chip.cur{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc);font-weight:700}
#board{width:100%;height:auto;display:block;touch-action:manipulation}
.cell polygon{stroke:var(--panel);stroke-width:1}
.v1{fill:var(--v1)}.v2{fill:var(--v2)}.v3{fill:var(--v3)}.v4{fill:var(--v4)}.v5{fill:var(--v5)}
.tg{font-size:8px;text-anchor:middle;fill:var(--ink);opacity:.5;pointer-events:none}
.hl{fill:var(--hl);fill-opacity:.3;stroke:var(--hl);stroke-width:2.5;pointer-events:none}
.cell.sel{cursor:pointer}
.seedn{font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pn{font-size:9px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#fff;pointer-events:none}
.an{fill:#22262a;stroke:#fff;stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.slot{text-align:left;min-height:66px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.slot b{display:block}
.slot span{font-size:12px;color:var(--muted)}
.slot:disabled{opacity:.5}
.pc{border-left:5px solid var(--pc);padding-left:10px}
.pc.cur{background:color-mix(in srgb,var(--pc) 8%,var(--panel))}
.pc-h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pc-h .sc{margin-left:auto;font-weight:800;font-size:16px}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mk div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);font-size:13px}
.log{max-height:220px;overflow:auto;font-size:12.5px;color:var(--muted)}
.log div{padding:2px 0;border-bottom:1px dashed var(--line)}
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
#sheetWrap[hidden]{display:none}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet h3{margin-bottom:8px}
.item{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.item span{display:block;font-size:12px;color:var(--muted)}
.item:disabled{opacity:.45}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;z-index:20;max-width:90%;font-size:13px}
#toast[hidden]{display:none}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:8px 10px}
legend{padding:0 6px;font-weight:700}
select,input[type=number]{font:inherit;min-height:40px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=number]{width:72px}
label{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
details{margin:6px 0}
summary{cursor:pointer;font-weight:700;min-height:32px}
ul.rules{margin:6px 0 0;padding-left:18px;font-size:13px}
.seg{display:flex;gap:6px}
.seg .btn{flex:1}
.seg .btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<div id="sheetWrap" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<script>
'use strict';
/*ENGINE_START*/
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const DIRN=['東','北東','北西','西','南西','南東'];
const DIRANG=[0,-60,-120,180,120,60];
const PLANTS={
  balsam:{id:'balsam',n:'ホウセンカ',t:'自力散布',c:'#d6336c',mode:'wither',d:'実が弾けて種を飛ばす（花は枯れる）'},
  dandelion:{id:'dandelion',n:'たんぽぽ',t:'風散布',c:'#d98200',mode:'wither',d:'綿毛が風に乗って種を運ぶ（花は枯れる）'},
  oak:{id:'oak',n:'カシ',t:'動物散布',c:'#8d5a2b',mode:'keep',d:'動物が種を運ぶ（栄養を払えば花は枯れない）'},
  bamboo:{id:'bamboo',n:'タケノコ',t:'地下茎（栄養繁殖）',c:'#0f9d8a',mode:'regress',d:'地下茎で周囲に広がる（散布すると花は芽に戻る）'},
  pitcher:{id:'pitcher',n:'ウツボカズラ',t:'食虫植物（攻撃型）',c:'#e03131',mode:'keep',d:'虫を捕らえる攻撃型。近くに種を落とす（栄養を払えば花は枯れない）'},
  coconut:{id:'coconut',n:'ココヤシ',t:'水散布（遠距離）',c:'#1c7ed6',mode:'wither',d:'海流に乗って遠くへ種を運ぶ（花は枯れる）'},
  violet:{id:'violet',n:'スミレ',t:'蟻散布（守り型）',c:'#7048e8',mode:'keep',d:'アリが運び、種は守り付きで着地する（栄養を払えば花は枯れない）'}
};
const FORMS={
  balsam:[
    {n:'ホウセンカ（苗）',seeds:2,range:2,d:'距離2以内に種2つ'},
    {n:'ホウセンカ（実る）',seeds:2,range:3,d:'距離3以内に種2つ'},
    {n:'ホウセンカ（群生）',seeds:3,range:3,d:'距離3以内に種3つ。最終形ボーナス「群生」'}],
  dandelion:[
    {n:'たんぽぽ（ロゼット）',seeds:3,d:'風の中心点の周囲1マスに種3つ'},
    {n:'たんぽぽ（綿毛）',seeds:4,d:'種4つ'},
    {n:'たんぽぽ（野原）',seeds:4,fx:{dand:0},d:'種4つ。「風を読む」が無料。最終形ボーナス「風の道」'}],
  oak:[
    {n:'カシ（若木）',seeds:1,d:'動物の歩数以内に種1つ（枯れずに散布：栄養1）'},
    {n:'カシ（どんぐり）',seeds:2,d:'動物の歩数以内に種2つ'},
    {n:'カシ（大樹）',seeds:2,keepCost:0,fx:{reroll:0,pick:1},d:'種2つ。枯れずに散布が無料、動物の引き直しが無料・選ぶは栄養1。最終形ボーナス「花の輪」'}],
  bamboo:[
    {n:'タケノコ',seeds:2,range:1,d:'隣接マスに種2つ（散布すると花は芽に戻る）。急成長は栄養2'},
    {n:'若竹',seeds:3,range:1,fx:{bamboo:1},d:'隣接マスに種3つ。急成長は栄養1'},
    {n:'竹林',seeds:3,range:2,fx:{bamboo:0},d:'距離2以内に種3つ。急成長が無料。最終形ボーナス「竹林」'}],
  pitcher:[
    {n:'ウツボカズラ（若苗）',seeds:1,range:2,atk:1,predRange:2,d:'距離2以内に種1つ（枯れずに散布：栄養1）。攻撃カードの射程+1。固有効果「捕食」'},
    {n:'ウツボカズラ（捕虫袋）',seeds:2,range:2,atk:1,predRange:2,fx:{pred:1},d:'種2つ。攻撃カードの射程+1。「捕食」が栄養1'},
    {n:'ウツボカズラ（大型の罠）',seeds:2,range:3,atk:2,predRange:3,keepCost:0,fx:{pred:1},d:'距離3以内に種2つ、枯れずに散布が無料。攻撃カードの射程+2。「捕食」の射程3・花にも1段階ダメージ。最終形ボーナス「包囲網」'}],
  coconut:[
    {n:'ココナッツ',seeds:2,minDist:3,d:'元の花から距離3以上離れた空きマスなら、どこでも種2つ（遠くへ運ばれる）'},
    {n:'ココヤシ（若木）',seeds:2,minDist:3,fx:{tide:0},d:'距離3以上離れた空きマスに種2つ。「潮に乗る」が無料'},
    {n:'ココヤシ（浜）',seeds:2,minDist:3,fx:{tide:0},d:'種2つ。「潮に乗る」が無料。最終形ボーナス「離れ島」'}],
  violet:[
    {n:'スミレ（つぼみ）',seeds:1,range:2,guard:true,d:'距離2以内に種1つ（枯れずに散布：栄養1）。種は守り付きで着地。固有効果「アリの巣」'},
    {n:'スミレ（咲き始め）',seeds:2,range:2,guard:true,d:'距離2以内に守り付きの種を2つ'},
    {n:'スミレ（花畑）',seeds:2,range:3,guard:true,keepCost:0,fx:{nest:0},d:'距離3以内に守り付きの種を2つ。枯れずに散布が無料、「アリの巣」も無料。最終形ボーナス「花畑」'}]
};
const BONUS={
  balsam:{n:'群生',d:'隣り合う花が3輪連なると+2、5輪で+3、7輪以上で+4'},
  dandelion:{n:'風の道',d:'一直線に隣り合って並ぶ花が3輪で+2、4輪で+3、5輪以上で+4'},
  oak:{n:'花の輪',d:'あるマスの周囲6マスのうち3マスが自分の花なら+2、4マスで+3、5マス以上で+4'},
  bamboo:{n:'竹林',d:'隣り合う花の連なりが、中心からの距離の違う土地を3種類にまたぐと+2、4種類以上で+4'},
  pitcher:{n:'包囲網',d:'自分の花に隣り合う相手の株（種・芽・花）が1つにつき+1（最大+4）'},
  coconut:{n:'離れ島',d:'他の自分の花と隣り合っていない（孤立した）花1つにつき+1（最大+4）'},
  violet:{n:'花畑',d:'守り付きの自分の花が4輪で+2、6輪で+3、8輪以上で+4'}
};
const modeText=p=>{const m=PLANTS[p.plant].mode;return m==='wither'?'花は枯れる':m==='keep'?'枯れずに（栄養'+keepCost(p)+'）':'花は芽に戻る';};
const STAGE=['','種','芽','花'];
const CARDS={
  aphid:{id:'aphid',n:'アブラムシ',kind:'虫',deck:'insect',d:'相手の植物1つを1段階退化させる（種は消滅）',tg:'enemy'},
  caterpillar:{id:'caterpillar',n:'イモムシ',kind:'虫',deck:'insect',d:'相手の種か芽を1つ枯らす',tg:'enemyLow'},
  ladybug:{id:'ladybug',n:'テントウムシ',kind:'虫',deck:'insect',d:'自分の植物1つに守りを付ける（次のダメージを1回無効化）',tg:'own'},
  bee:{id:'bee',n:'ミツバチ',kind:'虫',deck:'insect',d:'栄養+3',tg:null},
  butterfly:{id:'butterfly',n:'チョウ',kind:'虫',deck:'insect',d:'自分の種か芽を1つ、1段階成長させる（主行動とは別）',tg:'ownGrow'},
  worm:{id:'worm',n:'ミミズ',kind:'動物',deck:'animal',steps:1,d:'自分の種か芽を1つ選び、その株と隣接する自分の種・芽をまとめて1段階成長させる',tg:'ownGrow'},
  dog:{id:'dog',n:'番犬',kind:'動物',deck:'animal',steps:2,d:'自分の植物1つと、隣接する自分の植物に守りを付ける',tg:'own'},
  squirrel:{id:'squirrel',n:'リス',kind:'動物',deck:'animal',steps:3,d:'栄養+2',tg:null},
  deer:{id:'deer',n:'シカ',kind:'動物',deck:'animal',steps:3,d:'相手の植物1つを2段階退化させる',tg:'enemy'},
  boar:{id:'boar',n:'イノシシ',kind:'動物',deck:'animal',steps:4,d:'相手の植物1つを掘り返して枯らす',tg:'enemy'},
  bear:{id:'bear',n:'クマ',kind:'動物',deck:'animal',steps:5,d:'相手の植物1つを枯らし、その隣の相手の植物も1段階退化させる',tg:'enemy'}
};
const DECKLIST={
  insect:[['aphid',4],['caterpillar',3],['ladybug',4],['bee',2],['butterfly',3]],
  animal:[['worm',2],['dog',3],['squirrel',2],['deer',3],['boar',2],['bear',1]]
};
const key=(q,r)=>q+','+r;
const P=k=>k.split(',').map(Number);
const inB=(q,r)=>Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=4;
const dist=(a,b)=>{const[x,y]=P(a),[u,v]=P(b);const dq=x-u,dr=y-v;return Math.max(Math.abs(dq),Math.abs(dr),Math.abs(dq+dr));};
const neighbors=k=>{const[q,r]=P(k);return DIRS.map(d=>[q+d[0],r+d[1]]).filter(c=>inB(c[0],c[1])).map(c=>key(c[0],c[1]));};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=k=>'('+k+')';
function allCells(){const a=[];for(let q=-4;q<=4;q++)for(let r=-4;r<=4;r++)if(inB(q,r))a.push(key(q,r));return a;}
let G=null;
function log(t){G.log.push({r:G.round,t});if(G.log.length>300)G.log.shift();}
function rollWind(){const s=[0,1,1,2,2,3][rnd(6)];return {dir:rnd(6),str:s};}
function windText(w){return w.str===0?'凪（風なし）':DIRN[w.dir]+'向き・強さ'+w.str;}
function makeDeck(kind){const c=[];DECKLIST[kind].forEach(([k,n])=>{for(let i=0;i<n;i++)c.push(k);});return shuffle(c);}
const LANDDEF={land4:1,land3:1,land2:2,land1:2,land0:3};
const landVal=k=>{const d=dist(k,'0,0');const v=G.cfg['land'+d];return v===undefined?LANDDEF['land'+d]:v;};
const formOf=p=>FORMS[p.plant][p.form];
const flowers=pid=>Object.keys(G.plants).filter(k=>G.plants[k].owner===pid&&G.plants[k].stage===3);
function comps(cells){
  const set=new Set(cells),seen=new Set(),out=[];
  cells.forEach(c=>{
    if(seen.has(c))return;const comp=[],st=[c];seen.add(c);
    while(st.length){const x=st.pop();comp.push(x);neighbors(x).forEach(y=>{if(set.has(y)&&!seen.has(y)){seen.add(y);st.push(y);}});}
    out.push(comp);
  });
  return out;
}
function bonusOf(pid){
  const p=G.players[pid];if(p.form<2)return 0;
  const fl=flowers(pid),set=new Set(fl);
  if(p.plant==='balsam'){const m=Math.max(0,...comps(fl).map(c=>c.length));return m>=7?4:m>=5?3:m>=3?2:0;}
  if(p.plant==='dandelion'){
    let best=0;
    fl.forEach(c=>{[0,1,2].forEach(d=>{
      const[q,r]=P(c);if(set.has(key(q-DIRS[d][0],r-DIRS[d][1])))return;
      let L=0,x=c;while(set.has(x)){L++;const[a,b]=P(x);x=key(a+DIRS[d][0],b+DIRS[d][1]);}
      best=Math.max(best,L);
    });});
    return best>=5?4:best===4?3:best===3?2:0;
  }
  if(p.plant==='oak'){let m=0;Object.keys(G.cells).forEach(k=>{m=Math.max(m,neighbors(k).filter(n=>set.has(n)).length);});return m>=5?4:m===4?3:m===3?2:0;}
  if(p.plant==='bamboo'){let m=0;comps(fl).forEach(c=>{m=Math.max(m,new Set(c.map(k=>dist(k,'0,0'))).size);});return m>=4?4:m===3?2:0;}
  if(p.plant==='pitcher'){const adj=new Set();fl.forEach(c=>neighbors(c).forEach(n=>{const x=G.plants[n];if(x&&x.owner!==pid)adj.add(n);}));return Math.min(4,adj.size);}
  if(p.plant==='coconut'){return Math.min(4,fl.filter(k=>!neighbors(k).some(n=>set.has(n))).length);}
  if(p.plant==='violet'){const n=fl.filter(k=>G.plants[k].shield).length;return n>=8?4:n>=6?3:n>=4?2:0;}
  return 0;
}
function scoreParts(pid){
  const land=flowers(pid).reduce((s,k)=>s+G.cells[k].v,0);const bonus=bonusOf(pid);
  return {land,bonus,total:land+bonus};
}
const score=pid=>scoreParts(pid).total;
function newGame(setup){
  const cfg=Object.assign({},setup.cfg);const n=setup.plants.length;
  const starts=n===2?['0,-4','0,4']:n===3?['4,0','0,-4','-4,4']:['0,-4','4,-4','0,4','-4,4'];
  G={cfg,round:1,phase:'play',cells:{},players:[],plants:{},turn:0,first:0,acted:false,drew:false,pend:null,
    windNow:rollWind(),windNext:rollWind(),decks:{insect:makeDeck('insect'),animal:makeDeck('animal')},discards:{insect:[],animal:[]},
    log:[],winner:null,fxUsed:false,fxWind:null,evoDone:false,ai:[]};
  G.ai=(setup.ai||[]).slice(0,n);while(G.ai.length<n)G.ai.push(false);
  allCells().forEach(k=>G.cells[k]={v:landVal(k)});

function* botTurnGen(pid){
  const p=G.players[pid];
  if(evolve(pid)===undefined)yield;
  if(p.plant==='pitcher'&&!G.fxUsed){
    const t=predTargets(p);
    if(t.length&&p.nu>=fxc('pred',p)+2){t.sort((a,b)=>G.plants[b].stage-G.plants[a].stage);if(fxPredate(pid,t[0])===undefined)yield;}
  }
  if(p.plant==='violet'&&!G.fxUsed){
    const t=nestTargets(p);
    if(t.length&&p.nu>=fxc('nest',p)+3){const s2=t.slice().sort((a,b)=>G.plants[b].stage-G.plants[a].stage);if(fxNest(pid,s2[0])===undefined)yield;}
  }
  if(!G.acted){
    const ft=fastTargets(p),gt=growTargets(p),fl=flowers(pid),mode=PLANTS[p.plant].mode;
    const advancedGrow=gt.filter(k=>G.plants[k].stage===2);
    if(ft.length&&p.nu>=fxc('bamboo',p)+2&&Math.random()<0.5){
      if(grow(pid,ft[rnd(ft.length)],true)===undefined)yield;
    }else if(advancedGrow.length){
      if(grow(pid,advancedGrow[rnd(advancedGrow.length)])===undefined)yield;
    }else if(gt.length&&(fl.length<2||Math.random()<0.6)){
      if(grow(pid,gt[rnd(gt.length)])===undefined)yield;
    }else if(fl.length>=(mode==='wither'?2:1)){
      const cand=fl.slice().sort((a,b)=>dist(b,'0,0')-dist(a,'0,0'));
      let started=false;
      for(const c of cand){if(startDisperse(pid,c)===undefined){started=true;break;}}
      if(started){
        yield;
        let steps=0;
        while(G.pend&&steps++<12){
          if(p.plant==='balsam'&&G.pend.boost<2&&p.nu>=fxc('balsam',p)+1){if(fxBalsam(pid)===undefined)yield;}
          if(p.plant==='oak'&&G.pend.placed===0&&!G.fxUsed&&p.nu>=fxc('reroll',p)+3&&Math.random()<0.3){if(fxOak(pid,'re')===undefined)yield;}
          if(p.plant==='coconut'&&G.pend.placed===0&&!G.pend.tide&&p.nu>=fxc('tide',p)+2&&Math.random()<0.4){if(fxTide(pid)===undefined)yield;}
          const o=pendOptions();if(!o.length)break;
          o.sort((a,b)=>dist(a,'0,0')-dist(b,'0,0'));
          placeDisperse(o[0]);
          yield;
        }
        if(G.pend)finishDisperse();
      }
    }else if(gt.length){
      if(grow(pid,gt[rnd(gt.length)])===undefined)yield;
    }
  }
  if(!G.drew){
    const dI=drawCostOf('insect'),dA=drawCostOf('animal'),buf=3;
    if(p.nu>=dA+buf&&Math.random()<0.35){if(drawCard(pid,'animal')===undefined)yield;}
    else if(p.nu>=dI+buf&&Math.random()<0.4){if(drawCard(pid,'insect')===undefined)yield;}
  }
  for(let i=p.hand.length-1;i>=0;i--){
    const id=p.hand[i],c=CARDS[id];
    if(isAtk(id)){
      const srcs=atkSources(pid,id);
      if(srcs.length){
        let best=null;
        for(const s2 of srcs){const ts=cardTargets(pid,id,s2);for(const t of ts){const val=G.plants[t].stage;if(!best||val>best.val)best={s:s2,t,val};}}
        if(best&&Math.random()<0.75){if(useCard(pid,i,best.t,best.s)===undefined)yield;}
      }
    }else if(c.tg){
      const ts=cardTargets(pid,id);
      if(ts.length){if(useCard(pid,i,ts[rnd(ts.length)])===undefined)yield;}
    }else{
      if(useCard(pid,i,null)===undefined)yield;
    }
  }
  endTurn(pid);
  yield;
}
function botTurn(pid){const g=botTurnGen(pid);let r=g.next();while(!r.done)r=g.next();}
function autoRunBots(){
  if(!G||G.phase!=='play'||!G.ai||!G.ai[G.turn])return;
  let guard=0;
  while(G.phase==='play'&&G.ai[G.turn]&&guard++<5000)botTurn(G.turn);
}
function stopAI(){if(ui.aiTimer){clearTimeout(ui.aiTimer);ui.aiTimer=null;}ui.aiGen=null;ui.aiPaused=false;}
function scheduleWatch(){if(ui.aiPaused)return;ui.aiTimer=setTimeout(watchStep,ui.aiSpeed||550);}
function watchStep(){
  ui.aiTimer=null;
  if(!G||G.phase!=='play'||!G.ai||!G.ai[G.turn]){stopAI();render();return;}
  if(!ui.aiGen)ui.aiGen=botTurnGen(G.turn);
  const r=ui.aiGen.next();
  render();
  if(r.done){ui.aiGen=null;if(G.phase==='play'&&G.ai[G.turn])scheduleWatch();}
  else scheduleWatch();
}
function startWatch(){
  if(!G||G.phase!=='play'||!G.ai||!G.ai[G.turn])return;
  if(ui.aiTimer||ui.aiGen)return;
  ui.aiPaused=false;scheduleWatch();
}
function advanceAI(){
  if(!G||G.phase!=='play'||!G.ai||!G.ai[G.turn])return;
  if(ui.watch)startWatch();else autoRunBots();
}
function aiPause(){ui.aiPaused=true;if(ui.aiTimer){clearTimeout(ui.aiTimer);ui.aiTimer=null;}}
function aiResumeWatch(){ui.aiPaused=false;scheduleWatch();}
function aiSkipTurn(){
  if(ui.aiTimer){clearTimeout(ui.aiTimer);ui.aiTimer=null;}
  if(!ui.aiGen&&G.ai[G.turn])ui.aiGen=botTurnGen(G.turn);
  while(ui.aiGen){const r=ui.aiGen.next();if(r.done){ui.aiGen=null;break;}}
  ui.aiPaused=false;
  if(G.phase==='play'&&G.ai[G.turn]){if(ui.watch)scheduleWatch();else autoRunBots();}
}
function aiSkipAll(){
  if(ui.aiTimer){clearTimeout(ui.aiTimer);ui.aiTimer=null;}
  if(ui.aiGen){while(ui.aiGen){const r=ui.aiGen.next();if(r.done){ui.aiGen=null;break;}}}

  ]);
  else if(a==='cancel-sel'){ui.sel=null;render();}
  else if(a==='grow'){const p=G.players[G.turn];pickCell('成長させる株を選ぶ（種か芽）',growTargets(p),k=>run(()=>grow(p.id,k)));}
  else if(a==='disperse'){const p=G.players[G.turn];pickCell('種を飛ばす花を選ぶ（'+modeText(p)+'）',flowers(p.id),k=>run(()=>startDisperse(p.id,k)));}
  else if(a==='evolve'){const p=G.players[G.turn];run(()=>evolve(p.id),()=>'「'+formOf(G.players[p.id]).n+'」に進化した！'+(G.players[p.id].form===2?'（最終形：形ボーナスが有効になります）':''));}
  else if(a==='draw-insect')run(()=>drawCard(G.turn,'insect'));
  else if(a==='draw-animal')run(()=>drawCard(G.turn,'animal'));
  else if(a==='cards')onCards();
  else if(a==='end-turn')run(()=>endTurn(G.turn));
  else if(a==='finish-pend')run(()=>{finishDisperse();});
  else if(a==='fx-balsam')run(()=>fxBalsam(G.turn));
  else if(a==='fx-oak-re')run(()=>fxOak(G.turn,'re'));
  else if(a==='fx-tide')run(()=>fxTide(G.turn));
  else if(a==='fx-oak-pick'){const p=G.players[G.turn];const top=animalPeek(3);openSheet('山札の上3枚から選ぶ（栄養'+fxc('pick',p)+'）',top.map((id,i)=>({label:CARDS[id].n+'（歩数'+CARDS[id].steps+'）',sub:'選ばなかったカードは山札に残ります',fn:()=>run(()=>fxOak(p.id,'pick',i))})));}
  else if(a==='fx')onFx();
  else if(a==='ai-pause'){aiPause();render();}
  else if(a==='ai-resume'){aiResumeWatch();render();}
  else if(a==='ai-skip-turn'){aiSkipTurn();render();}
  else if(a==='ai-skip-all'){aiSkipAll();render();}
});
function onFx(){
  const p=G.players[G.turn];
  if(p.plant==='bamboo'){const t=fastTargets(p);pickCell('急成長させる種を選ぶ（栄養'+fxc('bamboo',p)+'）',t,k=>run(()=>grow(p.id,k,true)));}
  else if(p.plant==='pitcher'){pickCell('捕食する相手の株を選ぶ（自分の株から'+(formOf(p).predRange||2)+'マス以内・栄養'+fxc('pred',p)+'）',predTargets(p),k=>run(()=>fxPredate(p.id,k)));}
  else if(p.plant==='violet'){pickCell('守りを付ける自分の株を選ぶ（栄養'+fxc('nest',p)+'）',nestTargets(p),k=>run(()=>fxNest(p.id,k)));}
  else if(p.plant==='dandelion'){
    const w=effWind();
    openSheet('風を読む（栄養'+fxc('dand',p)+'）',[
      {label:'風の向きを時計回りに1つずらす',sub:'今：'+windText(w),disabled:w.str===0,fn:()=>run(()=>fxWindAdjust(p.id,'cw'))},
      {label:'風の向きを反時計回りに1つずらす',sub:'今：'+windText(w),disabled:w.str===0,fn:()=>run(()=>fxWindAdjust(p.id,'ccw'))},
      {label:'風の強さを+1する',sub:'今：'+windText(w),disabled:w.str>=3,fn:()=>run(()=>fxWindAdjust(p.id,'str'))}
    ],'この手番の、自分の散布にだけ効きます。');
  }
}
function onCards(){
  const p=G.players[G.turn];
  openSheet('カードを使う',p.hand.map((id,i)=>{
    const c=CARDS[id];const atk=isAtk(id);
    const dis=atk?atkSources(p.id,id).length===0:(c.tg?cardTargets(p.id,id).length===0:false);
    return {label:c.n+'（'+c.kind+'）',sub:c.d+(atk?'　射程：自分の株から'+atkRange(id,p.id)+'マス以内'+(dis?'（今は届く相手なし）':''):''),disabled:dis,
      fn:()=>{
        if(atk)pickCell(c.n+'：攻撃の起点にする自分の株を選ぶ（射程'+atkRange(id,p.id)+'マス以内に相手の株がある株のみ）',atkSources(p.id,id),src=>{
          pickCell(c.n+'：'+fmt(src)+'から'+atkRange(id,p.id)+'マス以内の相手の株を選ぶ',cardTargets(p.id,id,src),k=>run(()=>useCard(p.id,i,k,src)));
        });
        else if(c.tg)pickCell(c.n+'：対象の株を選ぶ',cardTargets(p.id,id),k=>run(()=>useCard(p.id,i,k)));
        else run(()=>useCard(p.id,i,null));
      }};
  }));
}
render();
</script>
